<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Groove Discos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="login" class="d-flex flex-column min-vh-100">
  <div id="navbar"></div>

  <main class="container flex-grow-1 py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-7 col-lg-5">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <i class="bi bi-person-circle text-accent" style="font-size: 3rem;"></i>
              <h1 class="h3 mt-3">Entrar</h1>
              <p class="text-muted-2">Acesse sua conta na Groove Discos</p>
            </div>

            <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

            <form id="login-form">
              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" autocomplete="email" required placeholder="seu@email.com">
              </div>

              <div class="mb-4">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required placeholder="Sua senha">
              </div>

              <div class="d-grid">
                <button id="login-button" type="submit" class="btn btn-accent">Entrar</button>
              </div>
            </form>

            <p class="text-center text-muted-2 mt-4 mb-0">
              Ainda não possui conta? <a href="register.html">Criar conta</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts/config.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/api.js"></script>
  <script src="scripts/ui.js"></script>
  <script src="scripts/navbar.js"></script>
  <script src="scripts/login.js"></script>
</body>
</html>
