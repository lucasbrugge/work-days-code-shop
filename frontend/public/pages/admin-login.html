<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso administrativo | Groove Discos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body data-page="admin-login" class="d-flex flex-column min-vh-100">
  <div id="navbar"></div>

  <main class="container flex-grow-1 py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card p-4 shadow-sm">
          <h1 class="h3 mb-1"><i class="bi bi-shield-lock text-accent"></i> Acesso administrativo</h1>
          <p class="text-muted-2">Área restrita a administradores da loja.</p>

          <div id="alert"></div>

          <form id="admin-login-form" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="email" name="email" required autocomplete="username">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Senha</label>
              <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-dark w-100" id="submit">Entrar no painel</button>
          </form>

          <p class="text-center small mt-3 mb-0">
            <a href="login.html" class="text-muted-2">&larr; Voltar ao login de cliente</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/config.js"></script>
  <script src="../scripts/auth.js"></script>
  <script src="../scripts/api.js"></script>
  <script src="../scripts/ui.js"></script>
  <script src="../scripts/navbar.js"></script>
  <script src="../scripts/admin-login.js"></script>
</body>
</html>
