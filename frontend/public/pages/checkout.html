<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Checkout - Groove Discos</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <link href="../css/styles.css" rel="stylesheet">
</head>

<body data-page="checkout" class="d-flex flex-column min-vh-100">

  <div id="navbar"></div>

  <main class="flex-grow-1">

    <section class="container py-5">

      <div class="mb-4">
        <h1 class="h2">Checkout</h1>
        <p class="text-muted-2">Escolha o endereço de entrega e confirme seu pedido.</p>
      </div>

      <div id="checkout-alert"></div>

      <form id="checkout-form" novalidate>
        <div class="row g-4">

          <div class="col-lg-7">
            <div class="card border-0 shadow-sm mb-4">
              <div class="card-body">
                <h2 class="h5 mb-4">Endereço de entrega</h2>

                <div id="saved-addresses"></div>

                <div id="new-address">
                  <div class="row">
                  <div class="col-md-4 mb-3">
                    <label for="zip_code" class="form-label">CEP</label>
                    <input type="text" id="zip_code" name="zip_code" class="form-control" autocomplete="postal-code" maxlength="10">
                  </div>
                  <div class="col-md-8 mb-3">
                    <label for="street" class="form-label">Rua</label>
                    <input type="text" id="street" name="street" class="form-control" autocomplete="address-line1">
                  </div>
                  </div>
                  <div class="row">
                  <div class="col-md-4 mb-3">
                    <label for="number" class="form-label">Número</label>
                    <input type="text" id="number" name="number" class="form-control" >
                  </div>
                  <div class="col-md-8 mb-3">
                    <label for="complement" class="form-label">Complemento (opcional)</label>
                    <input type="text" id="complement" name="complement" class="form-control" >
                  </div>
                  </div>
                  <div class="row">
                  <div class="col-md-5 mb-3">
                    <label for="neighborhood" class="form-label">Bairro</label>
                    <input type="text" id="neighborhood" name="neighborhood" class="form-control" >
                  </div>
                  <div class="col-md-5 mb-3">
                    <label for="city" class="form-label">Cidade</label>
                    <input type="text" id="city" name="city" class="form-control" >
                  </div>
                  <div class="col-md-2 mb-3">
                    <label for="state" class="form-label">UF</label>
                    <input type="text" id="state" name="state" class="form-control" maxlength="2" placeholder="PR" style="text-transform:uppercase;">
                  </div>
                  </div>
                </div>

              </div>
            </div>
          </div>

          <div class="col-lg-5">
            <div class="card border-0 shadow-sm">
              <div class="card-body">
                <h2 class="h5 mb-4">Resumo do pedido</h2>

                <div id="checkout-summary"></div>

                <button type="submit" id="finish-order" class="btn btn-accent w-100 mt-4">
                  Confirmar pedido
                </button>
                <a href="cart.html" class="btn btn-outline-secondary w-100 mt-2">Voltar ao carrinho</a>
              </div>
            </div>
          </div>

        </div>
      </form>

    </section>

  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="../scripts/config.js"></script>
  <script src="../scripts/auth.js"></script>
  <script src="../scripts/api.js"></script>
  <script src="../scripts/ui.js"></script>
  <script src="../scripts/navbar.js"></script>
  <script src="../scripts/format.js"></script>
  <script src="../scripts/checkout.js"></script>

</body>
</html>
