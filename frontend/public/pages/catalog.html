<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo | Groove Discos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body data-page="catalog" class="d-flex flex-column min-vh-100">
  <div id="navbar"></div>

  <main class="container flex-grow-1 py-4">
    <h1 class="h2 mb-4">Catálogo</h1>

    <form id="filters" class="row g-2 mb-4">
      <div class="col-12 col-md-5">
        <input type="search" id="search" class="form-control" placeholder="Buscar por nome...">
      </div>
      <div class="col-6 col-md-3">
        <select id="category" class="form-select">
          <option value="">Todas as categorias</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <select id="sort" class="form-select">
          <option value="recent">Mais recentes</option>
          <option value="price_asc">Menor preço</option>
          <option value="price_desc">Maior preço</option>
        </select>
      </div>
      <div class="col-12 col-md-1 d-grid">
        <button class="btn btn-accent" type="submit" aria-label="Buscar"><i class="bi bi-search"></i></button>
      </div>
    </form>

    <div id="products"></div>
    <nav id="pagination" class="mt-4" aria-label="Paginação"></nav>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/config.js"></script>
  <script src="../scripts/auth.js"></script>
  <script src="../scripts/api.js"></script>
  <script src="../scripts/ui.js"></script>
  <script src="../scripts/navbar.js"></script>
  <script src="../scripts/catalog.js"></script>
</body>
</html>
