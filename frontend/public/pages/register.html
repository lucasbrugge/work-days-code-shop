<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Criar conta | Groove Discos</title>

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet"
  >

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <!-- CSS do projeto -->
  <link
    href="../css/styles.css"
    rel="stylesheet"
  >
</head>


<body
  data-page="register"
  class="d-flex flex-column min-vh-100"
>

  <!-- Navbar -->
  <div id="navbar"></div>


  <main class="container flex-grow-1 py-5">

    <div class="row justify-content-center">

      <div class="col-12 col-md-7 col-lg-5">

        <div class="card border-0 shadow-sm">

          <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">

              <i
                class="bi bi-person-plus text-accent"
                style="font-size: 3rem;"
              ></i>

              <h1 class="h3 mt-3">
                Criar conta
              </h1>

              <p class="text-muted-2">
                Cadastre-se na Groove Discos
              </p>

            </div>


            <!-- Mensagens gerais -->
            <div
              id="register-alert"
              class="alert alert-danger d-none"
              role="alert"
            ></div>


            <form id="register-form">

              <!-- Nome -->
              <div class="mb-3">

                <label
                  for="name"
                  class="form-label"
                >
                  Nome
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="name"
                  name="name"
                  autocomplete="name"
                  required
                >

              </div>


              <!-- E-mail -->
              <div class="mb-3">

                <label
                  for="email"
                  class="form-label"
                >
                  E-mail
                </label>

                <input
                  type="email"
                  class="form-control"
                  id="email"
                  name="email"
                  autocomplete="email"
                  required
                >

              </div>


              <!-- Senha -->
              <div class="mb-3">

                <label
                  for="password"
                  class="form-label"
                >
                  Senha
                </label>

                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  minlength="8"
                  autocomplete="new-password"
                  required
                >

                <div class="form-text">
                  A senha deve possuir pelo menos 8 caracteres.
                </div>

              </div>


              <!-- Confirmação de senha -->
              <div class="mb-4">

                <label
                  for="password_confirmation"
                  class="form-label"
                >
                  Confirmar senha
                </label>

                <input
                  type="password"
                  class="form-control"
                  id="password_confirmation"
                  name="password_confirmation"
                  minlength="8"
                  autocomplete="new-password"
                  required
                >

              </div>


              <!-- Botão -->
              <div class="d-grid">

                <button
                  id="register-button"
                  type="submit"
                  class="btn btn-accent"
                >
                  Criar conta
                </button>

              </div>

            </form>


            <p
              class="text-center text-muted-2 mt-4 mb-0"
            >
              Já possui uma conta?

              <a href="login.html">
                Entrar
              </a>
            </p>

          </div>

        </div>

      </div>

    </div>

  </main>


  <!-- Footer -->
  <div id="footer"></div>


  <!-- Bootstrap -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <!-- Scripts do projeto -->
<script src="../scripts/config.js"></script>
<script src="../scripts/auth.js"></script>
<script src="../scripts/api.js"></script>
<script src="../scripts/ui.js"></script>
<script src="../scripts/navbar.js"></script>
<script src="../scripts/register.js"></script>

</body>

</html>
