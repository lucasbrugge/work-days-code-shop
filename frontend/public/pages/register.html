<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta | Groove Discos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body data-page="register" class="d-flex flex-column min-vh-100">
  <div id="navbar"></div>

  <main class="container flex-grow-1 py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card p-4 shadow-sm">
          <h1 class="h3 mb-1">Criar conta</h1>
          <p class="text-muted-2">É rápido, e seu carrinho é mantido.</p>

          <div id="alert"></div>

          <form id="register-form" novalidate>
            <div class="mb-3">
              <label for="name" class="form-label">Nome</label>
              <input type="text" class="form-control" id="name" name="name" required autocomplete="name">
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Senha</label>
              <input type="password" class="form-control" id="password" name="password" required minlength="8" autocomplete="new-password">
              <div class="form-text">Mínimo de 8 caracteres.</div>
            </div>
            <div class="mb-3">
              <label for="password_confirmation" class="form-label">Confirmar senha</label>
              <input type="password" class="form-control" id="password_confirmation" name="password_confirmation" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-accent w-100" id="submit">Criar conta</button>
          </form>

          <p class="text-center small mt-3 mb-0">
            Já tem conta? <a href="login.html" class="text-accent">Entrar</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/config.js"></script>
  <script src="../scripts/auth.js"></script>
  <script src="../scripts/api.js"></script>
  <script src="../scripts/ui.js"></script>
  <script src="../scripts/navbar.js"></script>
  <script src="../scripts/register.js"></script>
</body>
</html>
