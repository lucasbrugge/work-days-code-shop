<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu Carrinho | Groove Discos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="cart" class="d-flex flex-column min-vh-100">
  <div id="navbar"></div>

  <main class="container flex-grow-1 py-5">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div>
        <h1 class="h2 mb-1">Meu Carrinho</h1>
        <p class="text-muted-2 mb-0">Revise seus itens antes de finalizar a compra.</p>
      </div>
      <a href="catalog.html" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Continuar comprando
      </a>
    </div>

    <div id="cart-container">
      <div class="card border-0 shadow-sm p-4 text-center py-5">
        <i class="bi bi-bag-x fs-1 text-muted-2"></i>
        <h3 class="h5 mt-3 mb-2">Seu carrinho está vazio</h3>
        <p class="text-muted-2 mb-4">Explore nosso catálogo de vinis, CDs e cassetes para adicionar novos discos.</p>
        <div>
          <a href="catalog.html" class="btn btn-accent">Ver Catálogo Completo</a>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts/config.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/api.js"></script>
  <script src="scripts/ui.js"></script>
  <script src="scripts/navbar.js"></script>
</body>
</html>
