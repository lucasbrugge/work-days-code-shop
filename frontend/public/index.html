<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Groove Discos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="home" class="d-flex flex-column min-vh-100">
  <div id="navbar"></div>

  <main class="flex-grow-1">
    <!-- Hero -->
    <section class="container hero py-5">
      <div class="row align-items-center g-5">
        <div class="col-lg-6">
          <span class="hero-pill mb-3">Loja de música</span>
          <h1 class="mt-3">O som da sua coleção, em <span class="text-accent">vinil</span>, CD e cassete</h1>
          <p class="text-muted-2 fs-5 mt-3">Compre sem login, entre na conta quando quiser: seu carrinho continua salvo.</p>
          <div class="d-flex flex-wrap gap-2 mt-4">
            <a href="pages/catalog.html" class="btn btn-accent btn-lg">Ver catálogo <i class="bi bi-arrow-right"></i></a>
            <a href="pages/cart.html" class="btn btn-outline-secondary btn-lg"><i class="bi bi-bag"></i> Meu carrinho</a>
          </div>
          <div class="hero-info d-flex flex-wrap gap-4 mt-4">
            <span><i class="bi bi-truck"></i> Frete grátis acima de R$ 200</span>
            <span><i class="bi bi-shield-check"></i> Pagamento simulado</span>
          </div>
        </div>
        <div class="col-lg-6">
          <img src="assets/img/hero.jpg" alt="Loja de discos" class="hero-img">
        </div>
      </div>
    </section>

    <!-- Destaques -->
    <section id="destaques" class="container py-4">
      <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
          <h2 class="h3 mb-1">Destaques da semana</h2>
          <p class="text-muted-2 mb-0">Escolhas da equipe para começar a coleção.</p>
        </div>
      </div>
      <div id="featured" class="row g-4"></div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts/config.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/api.js"></script>
  <script src="scripts/ui.js"></script>
  <script src="scripts/navbar.js"></script>
  <script src="scripts/home.js"></script>
</body>
</html>
