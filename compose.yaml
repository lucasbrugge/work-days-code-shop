services:
  backend:
    build: ./backend
    ports:
      - "8000:80"
    volumes:
      - ./backend:/app
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
  #  frontend:
  #    build: ./frontend
  #    ports:
  #      - "8080:80"
  #    volumes:
  #      - ./backend/data:/app/data
  #    depends_on:
  #      - db
  #    environment:
  #      DB_HOST: db
  #      DB_PORT: 3306
  #      DB_NAME: ${MYSQL_DATABASE}
  #      DB_USER: ${MYSQL_USER}
  #      DB_PASSWORD: ${MYSQL_PASSWORD}
  db:
    image: mysql:8.0
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data:
